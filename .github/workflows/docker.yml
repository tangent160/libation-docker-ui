name: release

# Tags only. There are no validation builds on main or pull requests, so the
# only thing that ever runs CI — and the only thing that publishes — is a v* tag.
on:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/libation-webui

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      # Fail before the expensive build: a v1.2.3 tag must be built from a
      # commit whose VERSION file says 1.2.3.
      - name: Tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag v$tag does not match VERSION file ($file)"
            exit 1
          fi

      # A hyphenated version (v1.1.0-rc1) is a prerelease: it publishes its own
      # image tag so testers can pull it, but never moves `latest` or major.minor.
      - name: Release metadata
        id: rel
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.rel.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.rel.outputs.prerelease == 'false' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only. Libation also publishes arm64, and libation-update.sh
          # handles it, but emulating this image's build under QEMU is too slow
          # for CI — add a native arm64 runner before enabling it here.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.rel.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.rel.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.rel.outputs.prerelease == 'true' }}
          body: |
            Container image:

            ```
            docker pull ${{ env.IMAGE }}:${{ steps.rel.outputs.version }}
            ```

            See [CHANGELOG.md](CHANGELOG.md) for what changed.
