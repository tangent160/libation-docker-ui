server {
    listen 8080 default_server;
    server_name _;

    # Keep the Location header relative so a host port other than 8080
    # (or a reverse proxy in front) is not rewritten away.
    absolute_redirect off;

    # Large enough for noVNC's traffic; the real data path is the websocket.
    client_max_body_size 16m;

    # Unauthenticated so Docker/unraid health checks keep working.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # A `return` here would run in the rewrite phase and skip basic auth
    # entirely, so serve a real file and let the access phase do its job.
    # The page also picks the noVNC resize mode per client; see the comment in
    # /opt/webroot/index.html.
    location = / {
        include /etc/nginx/conf.d/auth.inc;
        root /opt/webroot;
        try_files /index.html =404;
    }

    location / {
        include /etc/nginx/conf.d/auth.inc;

        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # The VNC session is long-lived and idle whenever nobody is watching.
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_buffering off;
    }
}
