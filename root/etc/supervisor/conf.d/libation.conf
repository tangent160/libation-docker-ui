# X server and VNC server in one process. DISPLAY_WIDTH/HEIGHT are only the
# initial geometry: AcceptSetDesktopSize lets the browser resize the desktop.
[program:xvnc]
priority=10
command=/usr/bin/Xvnc :1
    -geometry %(ENV_DISPLAY_WIDTH)sx%(ENV_DISPLAY_HEIGHT)s
    -depth %(ENV_DISPLAY_DEPTH)s
    -rfbport 5900
    -localhost
    -SecurityTypes None
    -AlwaysShared
    -AcceptSetDesktopSize
    -desktop Libation
    -MaxDisconnectionTime 0
user=libation
environment=HOME="%(ENV_HOME)s"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
priority=20
command=/usr/local/bin/wait-for-x.sh /usr/bin/openbox --config-file /etc/xdg/openbox/rc.xml
user=libation
environment=DISPLAY=":1",HOME="%(ENV_HOME)s"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:websockify]
priority=40
# Bound to loopback so the only way in is through nginx, which is where basic
# auth lives. On the default bridge network 6080 is unreachable anyway, but with
# --network host an all-interfaces bind would expose the desktop unauthenticated.
command=/usr/bin/websockify --web /usr/share/novnc 127.0.0.1:6080 localhost:5900
user=libation
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
priority=50
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:libation]
priority=60
command=/usr/local/bin/start-libation.sh
user=libation
autorestart=true
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
